# The demo application. The ConfigMap is mounted as a DIRECTORY (no subPath): Kubernetes only
# propagates ConfigMap updates to directory mounts, through an atomic symlink swap.
# Image: build with dta-example-app/Dockerfile and push to your registry.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: garage
  namespace: default
  labels:
    app: garage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: garage
  template:
    metadata:
      annotations:
        instrumentation.opentelemetry.io/inject-java: "true"
      labels:
        app: garage
    spec:
      containers:
        - name: garage
          image: localhost:5001/dynamic-trace-app:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: DYNAMIC_TRACE_CONFIG_FILE
              value: /etc/dynamic-trace/agent-config.xml
          volumeMounts:
            - name: agent-config
              mountPath: /etc/dynamic-trace
              readOnly: true
          securityContext:
            readOnlyRootFilesystem: true   # supported: the extension writes no files
      volumes:
        - name: agent-config
          configMap:
            name: agent-config
            optional: true                 # no ConfigMap → no file → extension inactive
---
apiVersion: v1
kind: Service
metadata:
  name: garage
  namespace: default
spec:
  selector:
    app: garage
  ports:
    - name: http
      port: 8080
      targetPort: http
  type: ClusterIP
