name: CI

# Every push and pull request: full build with all quality gates, unit, architecture, memory and
# end-to-end tests, the latter against every supported OpenTelemetry agent version (spec
# packaging-and-distribution, "Supported OTel agent versions"). Branch pushes then publish a snapshot
# image: every run gets the next patch version (0.1.4-SNAPSHOT, 0.1.5-SNAPSHOT, ...) and the mutable
# "snapshot" tag moves to it. The release after a merge takes the number of the newest snapshot
# (release.yml). Pull requests only build the image.

on:
  workflow_dispatch:
  push:
    branches-ignore:
      - master
  pull_request:
    branches:
      - master
    types: [opened, synchronize, reopened]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: the build job runs the code of a pull request and only needs to read it.
permissions:
  contents: read

env:
  IMAGE: ghcr.io/gpcmol/dynamic-trace-agent
  PACKAGE: dynamic-trace-agent

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Agent versions the extension is tested against. Add a version here before recommending it
        # in the Instrumentation CR; the extension uses agent-internal APIs (docs/03-classloaders.md).
        otel-agent: ["2.30.0"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and test (agent ${{ matrix.otel-agent }})
        run: mvn -B verify -Dotel.agent.version=${{ matrix.otel-agent }}

  snapshot-image:
    needs: build
    runs-on: ubuntu-latest
    # One at a time over all branches: two runs must not take the same version number.
    concurrency:
      group: snapshot-version
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      # Highest X.Y.Z of the pom, the released images (X.Y.Z) and the earlier snapshots
      # (X.Y.Z-SNAPSHOT) in the registry, plus one patch version.
      - name: Next snapshot version
        id: version
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GHCR_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          TAGS="$(gh api --paginate "/users/${OWNER}/packages/container/${PACKAGE}/versions" \
            --jq '.[].metadata.container.tags[]' || true)" # fails when no image exists yet
          VERSION="$({ sed -n 's|^  <version>\(.*\)</version>|\1|p' pom.xml; echo "$TAGS"; } \
            | sed -nE 's/^v?([0-9]+\.[0-9]+\.[0-9]+)(-SNAPSHOT)?$/\1/p' | sort -V | tail -n 1 \
            | awk -F. '{ print $1 "." $2 "." $3 + 1 "-SNAPSHOT" }')"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build snapshot image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
          tags: |
            ${{ env.IMAGE }}:snapshot
            ${{ steps.version.outputs.version && format('{0}:{1}', env.IMAGE, steps.version.outputs.version) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
