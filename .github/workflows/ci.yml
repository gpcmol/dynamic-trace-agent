name: CI

# Every push and pull request: full build with all quality gates, unit, architecture, memory and
# end-to-end tests, the latter against every supported OpenTelemetry agent version with the
# application on every supported Java runtime (spec packaging-and-distribution, "Supported OTel
# agent versions"). The build itself always runs on JDK 21. Branch pushes then publish a snapshot
# image: every run gets the next patch version (0.1.4-SNAPSHOT, 0.1.5-SNAPSHOT, ...) and the mutable
# "snapshot" tag moves to it. The release after a merge takes the number of the newest snapshot
# (release.yml). Pull requests only build the image. Branch pushes also publish the garage demo
# image, only as the mutable "snapshot" tag: it is never released.

on:
  workflow_dispatch:
  push:
    branches-ignore:
      - master
      # Dependabot runs get no Actions secrets (GHCR_TOKEN), so they cannot publish a snapshot.
      # Their pull request still builds, tests and builds the image.
      - "dependabot/**"
  pull_request:
    branches:
      - master
    types: [opened, synchronize, reopened]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: the build job runs the code of a pull request and only needs to read it.
permissions:
  contents: read

env:
  IMAGE: ghcr.io/gpcmol/dynamic-trace-agent
  PACKAGE: dynamic-trace-agent
  APP_IMAGE: ghcr.io/gpcmol/dynamic-trace-app

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Agent versions the extension is tested against. Add a version here before recommending it
        # in the Instrumentation CR; the extension uses agent-internal APIs (docs/03-classloaders.md).
        otel-agent: ["2.32.0"]
        # Java runtimes of the instrumented application. The extension is compiled for Java 17.
        app-java: ["17", "21", "25"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          # The last version is the default (JAVA_HOME, build); each one is in JAVA_HOME_<v>_X64.
          java-version: |
            ${{ matrix.app-java }}
            21
          # Always take the newest Temurin patch release; the step below enforces the minimum.
          check-latest: true
          cache: maven

      - name: Require a minimum JDK patch release
        run: |
          set -euo pipefail
          # Minimum Temurin patch release per feature release (November 2026 CSPU).
          declare -A MIN=([17]="17.0.21.1" [21]="21.0.13.1" [25]="25.0.5.1")
          for v in 17 21 25; do
            var="JAVA_HOME_${v}_X64"; home="${!var:-}"
            [ -n "$home" ] || continue
            actual="$("$home/bin/java" -XshowSettings:properties -version 2>&1 | sed -n 's/^ *java.runtime.version = //p' | sed 's/+.*//; s/-.*//')"
            echo "JDK $v: $actual (minimum ${MIN[$v]})"
            [ "$(printf '%s\n%s\n' "${MIN[$v]}" "$actual" | sort -V | head -n1)" = "${MIN[$v]}" ] \
              || { echo "JDK $v is older than the minimum patch release"; exit 1; }
          done

      - name: Build and test (agent ${{ matrix.otel-agent }}, application on Java ${{ matrix.app-java }})
        run: |
          set -euo pipefail
          APP_JAVA_HOME_VAR="JAVA_HOME_${{ matrix.app-java }}_X64"
          APP_JAVA_HOME="${!APP_JAVA_HOME_VAR}"
          "${APP_JAVA_HOME}/bin/java" -version
          mvn -B verify -Dotel.agent.version=${{ matrix.otel-agent }} -Dit.java.home="${APP_JAVA_HOME}"

  snapshot-image:
    needs: build
    runs-on: ubuntu-latest
    # One at a time over all branches: two runs must not take the same version number.
    concurrency:
      group: snapshot-version
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      # Highest X.Y.Z of the pom, the released images (X.Y.Z) and the earlier snapshots
      # (X.Y.Z-SNAPSHOT) in the registry, plus one patch version.
      - name: Next snapshot version
        id: version
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GHCR_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          TAGS="$(gh api --paginate "/users/${OWNER}/packages/container/${PACKAGE}/versions" \
            --jq '.[].metadata.container.tags[]' || true)" # fails when no image exists yet
          VERSION="$({ sed -n 's|^  <version>\(.*\)</version>|\1|p' pom.xml; echo "$TAGS"; } \
            | sed -nE 's/^v?([0-9]+\.[0-9]+\.[0-9]+)(-SNAPSHOT)?$/\1/p' | sort -V | tail -n 1 \
            | awk -F. '{ print $1 "." $2 "." $3 + 1 "-SNAPSHOT" }')"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build snapshot image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
          tags: |
            ${{ env.IMAGE }}:snapshot
            ${{ steps.version.outputs.version && format('{0}:{1}', env.IMAGE, steps.version.outputs.version) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The garage demo (dta-example-app), for the Kubernetes example in deploy/kubernetes.
  app-snapshot-image:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
          check-latest: true
          cache: maven

      # The Dockerfile only copies the jar, so there is nothing to emulate for the other platform.
      - name: Package the demo application
        run: mvn -B -q -DskipTests -pl dta-example-app -am package

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build demo image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: dta-example-app/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
          tags: ${{ env.APP_IMAGE }}:snapshot
