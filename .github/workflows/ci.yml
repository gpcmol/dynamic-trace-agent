name: CI

# Every push and pull request: full build with all quality gates, unit, architecture, memory and
# end-to-end tests, the latter against every supported OpenTelemetry agent version (spec
# packaging-and-distribution, "Supported OTel agent versions"). Branch pushes then publish the
# mutable "snapshot" image; pull requests only build it.

on:
  workflow_dispatch:
  push:
    branches-ignore:
      - master
  pull_request:
    branches:
      - master
    types: [opened, synchronize, reopened]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/gpcmol/dynamic-trace-agent

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Agent versions the extension is tested against. Add a version here before recommending it
        # in the Instrumentation CR; the extension uses agent-internal APIs (docs/03-classloaders.md).
        otel-agent: ["2.30.0"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and test (agent ${{ matrix.otel-agent }})
        run: mvn -B verify -Dotel.agent.version=${{ matrix.otel-agent }}

  snapshot-image:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build snapshot image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
          tags: ${{ env.IMAGE }}:snapshot
          cache-from: type=gha
          cache-to: type=gha,mode=max
