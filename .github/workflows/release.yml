name: Release after merge

# When a pull request is merged into master: release the version of the newest snapshot image
# (0.1.5-SNAPSHOT → 0.1.5), or the next patch version when no snapshot was built since the last
# release. Build and test the release, commit the version and push tag vX.Y.Z. The tag triggers
# "Publish image".

on:
  pull_request:
    branches:
      - master
    types: [closed]

permissions:
  contents: write

env:
  PACKAGE: dynamic-trace-agent

jobs:
  release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.GHCR_TOKEN }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set the release version
        id: bump
        env:
          GH_TOKEN: ${{ secrets.GHCR_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          CURRENT="$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout)"
          CURRENT="${CURRENT%-SNAPSHOT}"
          if [[ ! "$CURRENT" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid current version: $CURRENT"
            exit 1
          fi
          IFS=. read -r MAJOR MINOR PATCH <<< "$CURRENT"
          NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
          # A snapshot built since the last release already took that number or a higher one
          # (ci.yml): the release gets the number of the newest snapshot.
          TAGS="$(gh api --paginate "/users/${OWNER}/packages/container/${PACKAGE}/versions" \
            --jq '.[].metadata.container.tags[]' || true)" # fails when no image exists yet
          NEW_VERSION="$(printf '%s\n' "$NEW_VERSION" "$TAGS" \
            | sed -nE 's/^([0-9]+\.[0-9]+\.[0-9]+)(-SNAPSHOT)?$/\1/p' | sort -V | tail -n 1)"
          mvn -B -q versions:set -DnewVersion="$NEW_VERSION" -DgenerateBackupPoms=false
          echo "new_version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Release ${CURRENT} -> ${NEW_VERSION}"

      - name: Build and test the release
        run: mvn -B verify

      - name: Commit, tag and push
        run: |
          set -euo pipefail
          NEW_VERSION="${{ steps.bump.outputs.new_version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): v${NEW_VERSION}"
          git tag "v${NEW_VERSION}"
          git push origin HEAD:master
          git push origin "v${NEW_VERSION}"
