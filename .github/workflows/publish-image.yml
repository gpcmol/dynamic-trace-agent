name: Publish image

# Every git tag vX.Y.Z: push the extension image as X.Y.Z (no "v") and "latest", then keep only the
# five newest release versions and the five newest snapshot versions (X.Y.Z-SNAPSHOT, pushed by CI)
# in GHCR.

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/gpcmol/dynamic-trace-agent
  PACKAGE: dynamic-trace-agent

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Image version (the git tag without "v")
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Keep only the latest five releases and snapshots
        env:
          GH_TOKEN: ${{ secrets.GHCR_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          TAGGED="$(gh api --paginate \
            "/users/${OWNER}/packages/container/${PACKAGE}/versions?per_page=100" \
            --jq '.[] | .id as $id | .metadata.container.tags as $tags | $tags[] | [$id, ., ($tags | length)] | @tsv')"
          for PATTERN in '^v?[0-9]+[.][0-9]+[.][0-9]+$' '^[0-9]+[.][0-9]+[.][0-9]+-SNAPSHOT$'; do
            VERSIONS="$(awk -F '\t' -v pattern="$PATTERN" '$2 ~ pattern' <<< "$TAGGED" \
              | sort -t $'\t' -k2,2Vr)"
            KEEP_IDS="$(head -n 5 <<< "$VERSIONS" | cut -f1 | sort -u)"
            # Never delete an image that carries another tag as well (latest, snapshot).
            ALL_IDS="$(awk -F '\t' '$3 == 1' <<< "$VERSIONS" | cut -f1 | sort -u)"
            while IFS= read -r VERSION_ID; do
              [[ -z "$VERSION_ID" ]] && continue
              if ! grep -Fxq "$VERSION_ID" <<< "$KEEP_IDS"; then
                echo "Deleting old package version ${VERSION_ID}"
                gh api --method DELETE "/users/${OWNER}/packages/container/${PACKAGE}/versions/${VERSION_ID}"
              fi
            done <<< "$ALL_IDS"
          done
