name: Publish image

# Every vX.Y.Z tag: push the extension image with the version tag and "latest", then keep only the
# five newest release versions in GHCR. The "snapshot" tag is managed by CI and not touched here.

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/gpcmol/dynamic-trace-agent
  PACKAGE: dynamic-trace-agent

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Keep only the latest five releases
        env:
          GH_TOKEN: ${{ secrets.GHCR_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          RELEASES="$(gh api --paginate \
            "/users/${OWNER}/packages/container/${PACKAGE}/versions?per_page=100" \
            --jq '.[] | [.id, (.metadata.container.tags[]? // "")] | @tsv' \
            | awk -F '\t' '$2 ~ /^v[0-9]+\.[0-9]+\.[0-9]+$/ { print $1 "\t" $2 }' \
            | sort -t $'\t' -k2,2Vr)"
          KEEP_IDS="$(printf '%s\n' "$RELEASES" | head -n 5 | cut -f1 | sort -u)"
          ALL_IDS="$(printf '%s\n' "$RELEASES" | cut -f1 | sort -u)"
          while IFS= read -r VERSION_ID; do
            [[ -z "$VERSION_ID" ]] && continue
            if ! grep -Fxq "$VERSION_ID" <<< "$KEEP_IDS"; then
              echo "Deleting old release package version ${VERSION_ID}"
              gh api --method DELETE "/users/${OWNER}/packages/container/${PACKAGE}/versions/${VERSION_ID}"
            fi
          done <<< "$ALL_IDS"
